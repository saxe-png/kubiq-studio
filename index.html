<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KUBIQ studio — weby, AI aplikácie a automatizácie</title>
    <meta
      name="description"
      content="KUBIQ studio navrhuje a programuje webové stránky, AI aplikácie a automatizácie. Pozrite si naše projekty a ozvite sa nám."
    />
    <meta name="theme-color" content="#050505" />
    <meta property="og:title" content="KUBIQ studio" />
    <meta property="og:description" content="Weby, AI aplikácie a automatizácie." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>

  <body class="is-loading">
    <!-- Jediné WebGL plátno: úvodná scéna aj časticové pozadie druhej stránky. -->
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>

    <!-- Načítavanie 0 – 100 % -->
    <div id="loader" role="status" aria-live="polite" aria-label="Načítavam">
      <div class="loader__count"><span id="loader-num">0</span><i>%</i></div>
      <div class="loader__bar"><span id="loader-bar"></span></div>
      <p class="loader__label">KUBIQ STUDIO</p>
    </div>

    <!-- ÚVOD: nápis, ruky a guľôčka sú v 3D scéne; tu je len prístupná vrstva nad ňou. -->
    <main id="intro">
      <h1 class="sr-only">KUBIQ STUDIO</h1>
      <p class="sr-only" id="intro-desc"></p>
      <!-- Zobrazí sa iba vtedy, keď zariadenie nezvládne WebGL. -->
      <div class="intro__fallback" aria-hidden="true">KUBIQ<br />STUDIO</div>
      <button id="orb" type="button" aria-describedby="intro-desc"></button>
      <p id="hint" aria-hidden="true"></p>
    </main>

    <!-- DRUHÁ STRÁNKA: obsah sa vykreslí zo súboru src/content/sk.js -->
    <div id="studio" hidden></div>

    <div id="panel-root"></div>
    <div id="lab-root"></div>

    <noscript>
      <div class="noscript">
        <strong>KUBIQ studio</strong> — weby, AI aplikácie a automatizácie. Pre zobrazenie stránky zapnite JavaScript.
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
